[package]
name = "provenward"
version = "1.0.0"
edition = "2021"
rust-version = "1.91"
description = "Product provenance, authenticity & recall registry for Stellar Soroban"
license = "MIT"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
soroban-sdk = { version = "27.0.5", default-features = false, features = ["alloc"] }

[dev-dependencies]
soroban-sdk = { version = "27.0.5", features = ["testutils"] }

[features]
testutils = ["soroban-sdk/testutils"]

[profile.release]
opt-level = "s"
overflow-checks = true

[profile.test]
opt-level = "s"
overflow-checks = true